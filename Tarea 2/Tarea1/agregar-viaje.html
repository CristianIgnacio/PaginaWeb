<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar viaje</title>

    <!-- CSS bootstrap -->
    <link rel="stylesheet" href="../css/estilo2.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

    <!-- JS bootstrap --> 
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
    
    <link href="../css/favicon.ico" rel="icon" type="image/x-icon">

</head>
<body class="bg-light">
<main>
    <div class="py-4 text-center"></div>
    <div class="container">
    <div class="row">
        <div class="col-md-7 col-lg-12">
        <h4 class="mb-4">Agrega tu viaje</h4>
        <!-- <form action="save_order1.py"  id="form-agregar-viaje" onsubmit="return validacion1()" class="needs-validation" enctype="multipart/form-data"> -->
        <form action="../cgi-bin/save_order1.py" method="POST"  id="form-agregar-viaje"  class="needs-validation" enctype="multipart/form-data">
            <div class="row">
                <div class="col-sm-6">
                    <label class="form-label">Pais origen:</label>
                    <select name="pais-origen" id="pais-origen" class="form-control">
                        <option selected value="">Elija una opcion ...</option>
                    </select>
                    <div></div>
                </div>
                
                <div class="col-sm-6" >
                    <label class="form-label">Ciudad origen:</label>
                    <select name="ciudad-origen" id="ciudad-origen" class="form-control" >
                        <option selected value="">Elija una opcion ...</option>
                    </select>
                    <div></div>
                </div>
                
                <div class="col-sm-6" >
                    <label class="form-label">Pais destino:</label>
                    <select name="pais-destino" id="pais-destino" class="form-control">
                        <option selected value="" >Elija una opcion ...</option>
                    </select>
                    <div></div>
                </div>
                
                <div class="col-sm-6" >
                    <label class="form-label">Ciudad destino:</label>
                    <select name="ciudad-destino" id="ciudad-destino" class="form-control">
                        <option selected value="">Elija una opcion ...</option>
                    </select>
                    <div class="invalid-feedback"></div>
                </div>
                
                <div class="col-sm-6">
                    <label class="form-label">Fecha ida:</label>
                    <input type="text" size="10" id="fecha-ida" name="fecha-ida" placeholder="año-mes-día" class="form-control">
                    <div class="invalid-feedback"></div>
                </div>
                
                <div class="col-sm-6">
                    <label class="form-label">Fecha regreso:</label>
                    <input type="text" size="10" id="fecha-regreso" name="fecha-regreso" placeholder="año-mes-día" class="form-control">
                    <div class="invalid-feedback"></div>
                </div>
                
                <div class="col-sm-6">
                    <label class="form-label">Espacio disponible:</label>
                    <select name="espacio-disponible" id="espacio-disponible" class="form-control">
                        <option selected value="">Elija una opcion ...</option>
                        <option value="10x10x10">10x10x10</option>
                        <option value="20x20x20">20x20x20</option>
                        <option value="30x30x30">30x30x30</option>
                    </select>
                    <div class="invalid-feedback"></div>
                </div>
                
                <div class="col-sm-6">
                    <label class="form-label">Kilos disponible:</label>
                    <select name="kilos-disponible" id="kilos-disponible" class="form-control">
                        <option selected value="">Elija una opcion ...</option>
                        <option value="200 gr">200 gr</option>
                        <option value="500 gr">500 gr</option>
                        <option value="800 gr">800 gr</option>
                        <option value="1 kg">1 kg</option>
                        <option value="1.5 kg">1.5 kg</option>
                        <option value="2 kg">2 kg</option>
                    </select>
                    <div></div>
                </div>
                
                <div class="col-sm-6">
                    <label class="form-label">Email viajero:</label>
                    <input type="text" size="30" id="email" name="email" placeholder="example@gmail.com" class="form-control">
                    <div class="invalid-feedback"></div>
                </div>
                
                <div class="col-sm-6">
                    <label class="form-label">Numero celular viajero (Opcional): </label>
                    <input type="text" size="15" id="celular" name="celular" placeholder="ej: +56912345678" class="form-control">
                    <div class="invalid-feedback"></div>
                </div>

            </div>
            <hr class="my-4">

            <button type="submit" class="w-100 btn btn-primary btn-lg" >Grabar Viaje</button>
        </form>
        </div>
    </div>
    </div>
    <div class="py-4 text-center"></div>
    <script src="../js/validacion.js"></script>
</main>
</body>
</html>
